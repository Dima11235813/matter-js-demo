# Dependency updates (Epic 7 · Task 7.1.1.8): grouped weekly PRs; every PR runs CI.
version: 2
updates:
  - package-ecosystem: npm # works with yarn.lock v1
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
